server:
  port: ${PORT:8081}

spring:
  application:
    name: edge-service

# All of these are overridden per-deployment via env vars (see fly.toml / fly secrets)
REGION: ${REGION:local}
ORIGIN_URL: ${ORIGIN_URL:http://localhost:8080}
CACHE_MAX_ENTRIES: ${CACHE_MAX_ENTRIES:100}
CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:60}

logging:
  level:
    root: INFO
