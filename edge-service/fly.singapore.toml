# fly.toml for edge-service — singapore region
# Deploy with: fly deploy --config fly.singapore.toml --app mini-cdn-edge-singapore
app = "mini-cdn-edge-singapore"
primary_region = "sin"

[build]

[env]
  PORT = "8081"
  REGION = "singapore"
  # Set the real origin-service URL after you've deployed it, e.g.:
  # fly secrets set ORIGIN_URL=https://mini-cdn-origin.fly.dev --app mini-cdn-edge-singapore
  ORIGIN_URL = "https://mini-cdn-origin.fly.dev"
  CACHE_MAX_ENTRIES = "200"
  CACHE_TTL_SECONDS = "60"

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
