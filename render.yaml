# Render Blueprint — deploys the whole mini-cdn stack for $0.
#
# How to use:
#   1. Push this repo to GitHub/GitLab.
#   2. In the Render dashboard: New + > Blueprint > select this repo.
#      Render reads this file and proposes all 6 services below at once.
#   3. Render assigns each service a URL like https://mini-cdn-origin.onrender.com
#      *before* it finishes deploying — grab those URLs from the dashboard
#      and paste them into the placeholder env vars below (search for
#      "REPLACE_AFTER_FIRST_DEPLOY"), then trigger a manual redeploy of the
#      services that reference them (router-service depends on all 3 edges
#      + origin; each edge depends on origin).
#
# Free-tier reality: Render's free web services spin down after 15 minutes
# idle and take 30-60s to wake on the next request. First load after a
# quiet period will be slow across every service that was asleep — that's
# expected, not a bug. The dashboard's own polling (fetchNodes every 3s,
# router's health probe every 5s) will keep everything awake as long as at
# least one person has the dashboard open.
#
# No Mumbai region exists on Render — Singapore is the real nearest PoP,
# which is itself a realistic CDN behavior (not every city gets its own
# edge). The dashboard's "simulate client location" dropdown can still
# pick Mumbai; the router will correctly send it to Singapore.

services:
  - type: web
    name: mini-cdn-origin
    runtime: docker
    region: virginia
    plan: free
    dockerfilePath: ./origin-service/Dockerfile
    dockerContext: ./origin-service
    envVars:
      - key: PORT
        value: "8080"

  - type: web
    name: mini-cdn-edge-virginia
    runtime: docker
    region: virginia
    plan: free
    dockerfilePath: ./edge-service/Dockerfile
    dockerContext: ./edge-service
    envVars:
      - key: PORT
        value: "8081"
      - key: REGION
        value: virginia
      - key: ORIGIN_URL
        value: "https://mini-cdn-edge-virginia.onrender.com"
      - key: CACHE_MAX_ENTRIES
        value: "200"
      - key: CACHE_TTL_SECONDS
        value: "60"

  - type: web
    name: mini-cdn-edge-frankfurt
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./edge-service/Dockerfile
    dockerContext: ./edge-service
    envVars:
      - key: PORT
        value: "8081"
      - key: REGION
        value: frankfurt
      - key: ORIGIN_URL
        value: "https://mini-cdn-edge-frankfurt.onrender.com"
      - key: CACHE_MAX_ENTRIES
        value: "200"
      - key: CACHE_TTL_SECONDS
        value: "60"

  - type: web
    name: mini-cdn-edge-singapore
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./edge-service/Dockerfile
    dockerContext: ./edge-service
    envVars:
      - key: PORT
        value: "8081"
      - key: REGION
        value: singapore
      - key: ORIGIN_URL
        value: "https://mini-cdn-edge-singapore.onrender.com"
      - key: CACHE_MAX_ENTRIES
        value: "200"
      - key: CACHE_TTL_SECONDS
        value: "60"

  - type: web
    name: mini-cdn-router
    runtime: docker
    region: virginia
    plan: free
    dockerfilePath: ./router-service/Dockerfile
    dockerContext: ./router-service
    envVars:
      - key: PORT
        value: "8082"
      - key: ROUTER_REGION
        value: virginia
      - key: ROUTER_LAT
        value: "38.9517"
      - key: ROUTER_LON
        value: "-77.4481"
      - key: EDGE_VIRGINIA_URL
        value: "https://mini-cdn-edge-virginia.onrender.com"
      - key: EDGE_FRANKFURT_URL
        value: "https://mini-cdn-edge-frankfurt.onrender.com"
      - key: EDGE_SINGAPORE_URL
        value: "https://mini-cdn-edge-singapore.onrender.com"

  - type: web
    name: mini-cdn-dashboard
    runtime: static
    buildCommand: cd dashboard && npm install && npm run build
    staticPublishPath: ./dashboard/dist
    envVars:
      - key: VITE_ROUTER_URL
        value: "https://mini-cdn-router.onrender.com" # router's onrender.com URL
      - key: VITE_ORIGIN_URL
        value: "https://mini-cdn-origin.onrender.com" # origin's onrender.com URL
