# fly.toml for origin-service
# Deploy with: fly launch --no-deploy (first time) then fly deploy
app = "mini-cdn-origin"
primary_region = "iad"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/files"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
